name: Version Bump and Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  version-bump-and-release:
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump type
        id: bump-type
        run: |
          # Check PR labels for version bump type
          # Default to patch if no label specified
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'

          if echo "$LABELS" | grep -q '"major"'; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q '"minor"'; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        run: |
          # Updates package.json and package-lock.json, then runs the "version"
          # script, which updates manifest.json and versions.json
          npm version "${{ steps.bump-type.outputs.bump }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build plugin
        run: npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Commit and tag
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"

          git add package.json package-lock.json manifest.json versions.json
          git commit -m "Bump version to $NEW_VERSION"
          git tag -a "$NEW_VERSION" -m "$NEW_VERSION"

      - name: Push changes and tag
        run: |
          git push origin main
          git push origin --tags

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          gh release create "$NEW_VERSION" \
            --title="$NEW_VERSION" \
            --draft \
            main.js manifest.json
